[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithguard"
version = "0.1.0"
description = "Detect, decide on and repair numeric errors in AI answers about financial reports"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "lightgbm>=4.0", "score-select>=0.1.1"]

[project.scripts]
faithguard = "faithguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
