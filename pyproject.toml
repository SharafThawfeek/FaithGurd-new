[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithguard"
version = "0.1.0"
description = "Detect, decide on and repair numeric errors in AI answers about financial reports"
requires-python = ">=3.11"

[project.scripts]
faithguard = "faithguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
