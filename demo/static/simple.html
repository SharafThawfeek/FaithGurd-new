<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaithGuard Simple</title>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">FG</span> FaithGuard</div>
  <div id="ai" class="ai"></div>
  <a class="full" href="/">Full demo with every detail →</a>
</header>
<main id="main" class="main">
  <section class="hero">
    <h1>Does the AI get the numbers right?</h1>
    <p>Ask a question about a company's annual report. An AI answers it. FaithGuard checks every number in the answer against the report, then <b class="g">sends</b> it, <b class="b">fixes</b> it, or <b class="a">holds it back</b>.</p>
  </section>
  <div id="ask"></div>
  <div id="result"></div>
</main>
<div id="toast" class="toast" hidden></div>
<script src="simple.js"></script>
</body>
</html>
